# Netlify build config (reference.md §12.1). Security headers + CSP land in Phase 5.1.
[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

# Hashed build assets never change, so cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
